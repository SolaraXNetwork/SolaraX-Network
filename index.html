<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolaraX Network</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a0f, #1a1033, #281b4d);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    img.logo {
      width: 180px;          /* ukuran logo */
      display: block;
      margin: 0 auto;        /* tengah */
    }
  h1 {
  font-size: 2.5rem;
  margin: -10px 0 15px 0; /* narik ke atas biar nempel ke logo */
  color: #4fc3f7;
  letter-spacing: 1.5px;
  line-height: 1.2;
}

    }
    p {
      font-size: 1.1rem;
      margin-bottom: 30px;
      color: #cccccc;
      max-width: 500px;
    }
    a.btn {
      display: inline-block;
      padding: 14px 30px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: #6200ea;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.3s ease;
    }
    a.btn:hover {
      background: #3700b3;
    }
    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>
<body>
  <img class="logo" src="https://raw.githubusercontent.com/SolaraXNetwork/SolaraX-Network/main/logo%20solarax%20tanpa%20bg.png" alt="SolaraX Logo">

  <h1>SolaraX Network</h1>
  <p>Decentralized. Fast. Secure.  
     The future of digital transactions in your pocket.</p>

  <a class="btn" href="https://play.google.com/store/apps/details?id=com.solarax" target="_blank">Download on Google Play</a>

  <footer>© 2025 SolaraX Network · solaraxnetwork@gmail.com </footer>
</body>
</html>
